[project]
profile = "dev"
locale = "us"
seed = 42


[data]
raw_dir = "data/raw"
processed_dir = "data/processed"
reports_dir = "reports"
artifacts_dir = "artifacts"
validation_fraction = 0.2
sample_groups_per_partition = 200
catalog_scope = "sampled_judged_union"


[text]
version = "title-brand-bullet-v1"
max_tokens = 128


[bm25]
k1 = 1.2
b = 0.75
top_k = 100


[embedding]
model_id = "sentence-transformers/all-MiniLM-L6-v2"
revision = "1110a243fdf4706b3f48f1d95db1a4f5529b4d41"
device = "cpu"
batch_size = 16
max_seq_length = 128
normalize_embeddings = true


[retrieval]
vector_block_size = 8192
dense_top_k = 100
rrf_constant = 60
rerank_top_k = 100


[training]
objective = "lambdarank"
num_threads = 4
num_leaves = 31
learning_rate = 0.05
n_estimators = 500
early_stopping_rounds = 30
label_gain = [0, 1, 3, 7]


[evaluation]
ranking_k = 10
retrieval_k = 100
bootstrap_iterations = 1000


[service]
host = "127.0.0.1"
port = 8000
max_query_chars = 256
max_top_k = 50
max_concurrent_searches = 2
