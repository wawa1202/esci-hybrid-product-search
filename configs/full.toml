# 完整 US 数据实验配置。
# 本文件只声明参数，不会自动执行数据处理、模型下载或训练。

[project]
profile = "full"
locale = "us"
seed = 42


[data]
raw_dir = "data/raw"
processed_dir = "data/processed"
reports_dir = "reports"
artifacts_dir = "artifacts"

# 仅在官方 train 内划分验证集；官方 test 单独保留。
validation_fraction = 0.2

# 本项目约定：0 表示不抽样，保留各分区全部查询组。
sample_groups_per_partition = 0

# 使用当前 locale 下的完整有效商品目录。
catalog_scope = "full_locale_catalog"


[text]
version = "title-brand-bullet-v1"
max_tokens = 128


[bm25]
k1 = 1.2
b = 0.75
top_k = 100


[embedding]
model_id = "sentence-transformers/all-MiniLM-L6-v2"

# 到向量编码阶段再填写实际确认的模型版本。
revision = "1110a243fdf4706b3f48f1d95db1a4f5529b4d41"

device = "cpu"
batch_size = 16
max_seq_length = 128
normalize_embeddings = true


[retrieval]
vector_block_size = 8192
dense_top_k = 100
rrf_constant = 60
rerank_top_k = 100


[training]
objective = "lambdarank"
num_threads = 4
num_leaves = 31
learning_rate = 0.05
n_estimators = 500
early_stopping_rounds = 30

# 顺序对应等级 I=0、C=1、S=2、E=3。
label_gain = [0, 1, 3, 7]


[evaluation]
ranking_k = 10
retrieval_k = 100
bootstrap_iterations = 1000


[service]
host = "127.0.0.1"
port = 8000
max_query_chars = 256
max_top_k = 50
max_concurrent_searches = 2
