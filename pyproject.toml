[build-system]
requires = [
    "setuptools>=68",
    "wheel",
]
build-backend = "setuptools.build_meta"


[project]
name = "product-search"
version = "0.1.0"
description = "A reproducible product search and learning-to-rank system"
requires-python = ">=3.12"
dependencies = [
    "pyarrow>=25,<26",
]


[project.optional-dependencies]
ml = [
    "numpy>=2,<3",
    "sentence-transformers>=3,<6",
    "lightgbm>=4,<5",
]

serve = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
]

ann = [
    "faiss-cpu>=1.8,<2",
]

dev = [
    "pytest>=8,<9",
    "httpx>=0.28,<1",
]

[project.scripts]
product-search = "product_search.__main__:main"

[tool.setuptools.package-data]
product_search = ["service/static/*.html"]


[tool.setuptools.packages.find]
where = [
    "src",
]
include = [
    "product_search*",
]


[tool.pytest.ini_options]
testpaths = [
    "tests",
]
pythonpath = [
    "src",
]
addopts = [
    "-ra",
]
